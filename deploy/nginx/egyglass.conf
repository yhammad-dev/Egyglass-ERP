# ═══════════════════════════════════════════════════════════════════════════════
#  EgyGlass ERP — nginx: الباب الوحيد إلى التطبيق
#  يُركَّب على: /etc/nginx/conf.d/default.conf
# ═══════════════════════════════════════════════════════════════════════════════
#
# كل سطر أدناه معلَّل. أربعة منها إن سقطت سقط النظام كلّه بأعراض غامضة —
# مُعلَّمة بـ🔴. لا تحذف واحدًا منها «تبسيطًا».

# 🔴 (1) مُحلِّل DNS الداخلي لـDocker + `proxy_pass` بمتغيّر.
# بدونه: nginx يحلّ اسم `app` **مرة واحدة عند الإقلاع** ويحتفظ بالـIP للأبد. أول
# `docker compose up -d app` يعيد إنشاء الحاوية بـIP جديد ⇒ **502 على كل طلب**
# حتى تُعاد تهيئة nginx — ولا شيء في سجلّ التطبيق يشير إلى السبب.
# `valid=10s` تُجبر إعادة الحلّ. ⚠️ المتغيّر في proxy_pass يُلغي إلحاق المسار
# تلقائيًّا، لذلك `$request_uri` مكتوب صراحةً في كل proxy_pass أدناه.
resolver 127.0.0.11 valid=10s ipv6=off;

# انزلاق 80 → 443 غير موجود عمدًا: مجموعة الأمان لا تفتح 80 أصلًا،
# فاستماعٌ هنا يخلق تناقضًا بين الملف والشبكة. الرابط يبدأ بـhttps دائمًا.

server {
    listen 443 ssl;
    http2  on;
    server_name _;

    # ── TLS (شهادة موقَّعة ذاتيًّا — بيئة قياس داخلية) ───────────────────────────
    ssl_certificate     /etc/nginx/tls/egyglass.crt;
    ssl_certificate_key /etc/nginx/tls/egyglass.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 1h;

    # ── Basic Auth: حساب مشترك واحد (أجهزة شركة فقط) ────────────────────────────
    # ⚠️ نصّ الـrealm بالإنجليزية عمدًا: ترويسة HTTP بمحارف غير ASCII تُنتج سلوكًا
    #    متباينًا بين المتصفحات.
    auth_basic           "EgyGlass ERP";
    auth_basic_user_file /etc/nginx/htpasswd/egyglass;

    # 🔴 (2) سقف جسم الطلب.
    # الافتراضي **1 ميجا** ⇒ كل رفع رسمة/مستند > 1 ميجا يُرفض بـ413 قبل أن يصل
    # التطبيق. `next.config.ts` يسمح بـ14mb (رفع 10MB + تضخّم base64 بنسبة 4/3)
    # ⇒ 20m هنا تغطّيه بهامش. هذه الطبقة نقل فقط؛ حارس الأعمال (10MB) يبقى
    # مفروضًا على البايتات داخل الـserver action.
    client_max_body_size 20m;
    client_body_timeout  120s;

    # الطباعة والتقارير قد تتجاوز الافتراضي (60s).
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    gzip             on;
    gzip_proxied     any;
    gzip_min_length  1024;
    gzip_types       text/plain text/css application/json application/javascript
                     text/xml application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-Frame-Options        "SAMEORIGIN"     always;
    add_header Referrer-Policy        "same-origin"    always;

    location / {
        # 🔴 (3) `Host $host` — لا `$proxy_host`.
        # Next 15 يفحص تطابق `Origin` مع `Host`/`X-Forwarded-Host` في **كل
        # server action** (حماية CSRF). تمرير `$proxy_host` (= "app") يجعل كل
        # فعل في النظام يفشل بخطأ عام لا يذكر السبب.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;

        # 🔴 (4) `X-Forwarded-Proto https` ثابتة.
        # Auth.js v5 (trustHost:true) يشتقّ بروتوكول الطلب من هذه الترويسة، ومنه
        # يقرّر اسم كوكي الجلسة: `__Secure-authjs.session-token` على https مقابل
        # `authjs.session-token` على http. غيابها ⇒ الكوكي يُكتب باسم ويُقرأ
        # بآخر ⇒ **حلقة إعادة توجيه لا تنتهي إلى /login** بعد دخول صحيح تمامًا.
        proxy_set_header X-Forwarded-Proto https;

        # ⚠️ `$remote_addr` وليس `$proxy_add_x_forwarded_for`.
        # `lib/rate-limit.ts:6` يستعمل قيمة هذه الترويسة **مفتاحًا خامًا**. الشكل
        # التراكمي يُلحق ما أرسله العميل ⇒ عميل يزوّر قيمة مختلفة كل طلب فيحصل
        # على دلو جديد كل مرة = تجاوز كامل للحدّ. `$remote_addr` غير قابل للتزوير.
        # وفائدة جانبية حقيقية: بلا proxy كانت الترويسة غائبة فيسقط المفتاح على
        # "unknown" ⇒ **الشركة كلها في دلو واحد سعته 60 طلبًا/دقيقة**، وجرس
        # الإشعارات يستقصي كل 30 ثانية لكل مستخدم (`notifications-bell.tsx:29`)
        # ⇒ 15 مستخدمًا بتبويبين = 60/دقيقة بالضبط، والجرس يتوقف **بصمت**
        # (`if (!res.ok) return;`). هذا السطر يفصل المستخدمين إلى دلاء مستقلة.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;

        # Next يبثّ HTML تدريجيًّا؛ التخزين المؤقت يحبس الاستجابة حتى تكتمل.
        proxy_buffering off;
        proxy_http_version 1.1;

        set $upstream_app http://app:3000;
        proxy_pass $upstream_app$request_uri;
    }
}
